<!--
  Shared email styles fragment.
  Included via th:replace="~{email/common-styles :: styles}" in the <head> of each template.
  Kept as a Thymeleaf fragment (not a linked .css file) because most email clients
  strip <link> tags and won't fetch external stylesheets — only inline <style> blocks
  (or inline style="" attributes) render reliably.
-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="styles">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <style>
        :root {
          --font-display: 'DM Sans', sans-serif;
          --font-body:    'DM Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          font-family: var(--font-body);
          background-color: #F5F5F5;
          color: #1F1F1F;
          padding: 40px 16px;
        }

        .wrapper {
          max-width: 580px;
          margin: 0 auto;
        }

        .header {
          background: #1F1F1F;
          border-radius: 22px 22px 0 0;
          padding: 40px 40px 32px;
          text-align: center;
        }

        .header-badge {
          display: inline-block;
          background: rgba(255,255,255,0.1);
          color: #E5E5E5;
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          padding: 6px 16px;
          border-radius: 999px;
          margin-bottom: 16px;
        }

        .header h1 {
          font-family: var(--font-display);
          font-size: 26px;
          font-weight: 600;
          color: #FFFFFF;
          line-height: 1.3;
        }

        .header p {
          font-size: 14px;
          color: #E5E5E5;
          opacity: 0.85;
        }

        .body {
          background: #FFFFFF;
          padding: 36px 40px;
        }

        .greeting {
          font-size: 15px;
          line-height: 1.7;
          color: #1F1F1F;
          margin-bottom: 24px;
        }

        .greeting strong {
          color: #1F1F1F;
        }

        .details-card,
        .message-recap {
          background: #F5F5F5;
          border: 1px solid #E0E0E0;
          border-radius: 14px;
          padding: 24px 28px;
          margin-bottom: 28px;
        }

        .details-card-title,
        .message-recap-title {
          font-family: var(--font-body);
          font-size: 13px;
          font-weight: 600;
          color: #6B6B6B;
          letter-spacing: 1px;
          text-transform: uppercase;
          margin-bottom: 16px;
        }

        .detail-row {
          padding: 10px 0;
          border-bottom: 1px solid #E0E0E0;
        }

        .detail-row:last-child {
          border-bottom: none;
          padding-bottom: 0;
        }

        .detail-row:first-of-type {
          padding-top: 0;
        }

        .detail-label {
          font-size: 11px;
          font-weight: 600;
          color: #8A8A8A;
          letter-spacing: 0.8px;
          text-transform: uppercase;
          margin-bottom: 4px;
        }

        .detail-value {
          font-size: 14px;
          font-weight: 500;
          color: #1F1F1F;
        }

        .message-recap-text {
          font-size: 14px;
          color: #1F1F1F;
          line-height: 1.7;
          white-space: pre-wrap;
        }

        .message-box {
          background: #F5F5F5;
          border-left: 3px solid #1F1F1F;
          border-radius: 0 10px 10px 0;
          padding: 16px 18px;
          font-size: 14px;
          color: #1F1F1F;
          line-height: 1.7;
          white-space: pre-wrap;
        }

        .info-note {
          background: #F0F0F0;
          border-left: 3px solid #1F1F1F;
          border-radius: 0 10px 10px 0;
          padding: 14px 18px;
          font-size: 13px;
          color: #3A3A3A;
          line-height: 1.6;
          margin-bottom: 28px;
        }

        .divider {
          border: none;
          border-top: 1px solid #E0E0E0;
          margin: 24px 0;
        }

        .footer {
          background: #F5F5F5;
          border-top: 1px solid #E0E0E0;
          border-radius: 0 0 22px 22px;
          padding: 24px 40px;
          text-align: center;
        }

        .footer p {
          font-size: 12px;
          color: #8A8A8A;
          line-height: 1.6;
        }
    </style>
</th:block>
